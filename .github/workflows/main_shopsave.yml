name: Build and deploy ASP.Net Core app to Azure Web App - shopsave

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_PATH: ComparisonAPI/ComparisonAPI.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Install Playwright Chromium
        working-directory: ComparisonAPI
        run: |
          pwsh bin/Release/net10.0/playwright.ps1 install chromium

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o "${{ env.PUBLISH_DIR }}" --no-build

      - name: Copy Playwright browsers into publish output
        run: |
          mkdir -p "${{ env.PUBLISH_DIR }}/.playwright"
          cp -r ~/.cache/ms-playwright "${{ env.PUBLISH_DIR }}/.playwright/ms-playwright"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6CE92445C3564A468B522D94ACF60A27 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_62E6FDD3A8C4422187357A48AEEA3C2A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_089137F5F4964FF0944830B5BCC803DD }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: shopsave
          slot-name: Production
          package: .
